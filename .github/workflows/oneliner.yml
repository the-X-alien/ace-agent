name: oneliner-check
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: One-line install (exact README command)
        shell: powershell
        run: irm https://raw.githubusercontent.com/the-X-alien/ace-agent/v0.1.5/scripts/install.ps1 | iex
      - name: Launch from user PATH
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User")
          ace-agent --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ace-agent doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: One-line install (exact README command)
        run: curl -fsSL https://raw.githubusercontent.com/the-X-alien/ace-agent/v0.1.5/scripts/install.sh | sh
      - name: Launch
        run: |
          grep -q "added by the Ace installer" "$HOME/.bashrc" "$HOME/.zshrc" "$HOME/.profile" 2>/dev/null || echo "no profile entry (PATH already had it or shell unknown)"
          export PATH="$HOME/.local/bin:$PATH"
          ace-agent --version
          ace-agent doctor
